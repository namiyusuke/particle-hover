<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGL Sketch</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #container {
        width: 100vw;
        height: 100vh;
      }
      /* パーティクルの上に重ねるテキストメニュー */
      #labels {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.4em;
        pointer-events: none; /* コンテナ自体はクリックを透過 */
        z-index: 10;
      }
      .word {
        pointer-events: auto; /* 文字だけホバー可能に */
        cursor: pointer;
        font-family: "Arial", "Helvetica", sans-serif;
        font-weight: bold;
        font-size: clamp(2.5rem, 9vw, 7rem);
        letter-spacing: 0.05em;
        color: #999;
        -webkit-user-select: none;
        user-select: none;
        line-height: 1;
        transition: color 0.3s ease, transform 0.3s ease, opacity 0.3s ease;
      }
      .word:hover,
      .word.active {
        color: #111;
        transform: scale(1.08);
      }
    </style>
  </head>
  <body>
    <div id="container"></div>
    <div id="labels">
      <span class="word" data-shape="model">MODEL</span>
      <span class="word" data-shape="model2">MODEL2</span>
      <span class="word" data-shape="model3">MODEL3</span>
      <span class="word" data-shape="sphere">SPHERE</span>
      <span class="word" data-shape="box">BOX</span>
      <span class="word" data-shape="torus">TORUS</span>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
